<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Strict CSP: only same-origin code, styles and connections; nothing inline, no eval.
         - Components must not use `styles`/`styleUrl`: Angular injects those inline, which
           style-src 'self' blocks. Style with Tailwind classes in templates instead.
         - Critical-CSS inlining is off in the production build (project.json) because it
           emits an inline onload handler.
         - frame-ancestors can't be set in a meta tag; a production server should send it as a header. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'"
    />
    <!-- Belt and braces: links are in the fragment anyway, which browsers never send. -->
    <meta name="referrer" content="no-referrer" />
    <title>Secure Live Messaging</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <slm-root></slm-root>
  </body>
</html>
